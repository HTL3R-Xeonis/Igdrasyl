<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ginnungagap - Admin</title>
<link rel="icon" type="image/svg+xml" href="/ginnungagap-mark.svg">
<link rel="stylesheet" href="/styles.css?v=ginnungagap-55">
<style>
  /* styles.css lays <body> out for the single-page app (full height, no scrolling) - this page is its own document. */
  body { display: block; height: auto; min-height: 100vh; overflow: auto; }
  #ap { max-width: 760px; margin: 0 auto; padding: 18px 20px 40px; box-sizing: border-box; }
  #ap-head { display: flex; align-items: baseline; gap: 16px; }
  #ap-head h1 { margin: 0; font-size: 18px; font-weight: 500; }
  #ap-head a { color: var(--dim); font-size: 12px; }
  #ap section { margin-top: 28px; }
  #ap h2 { font-size: 15px; font-weight: 500; margin: 0 0 10px; }
  #ap table { width: 100%; border-collapse: collapse; font-size: 13px; }
  #ap th, #ap td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  #ap-create-user, #ap-ai-config-form, #ap-bulk-create { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
  #ap-create-user input, #ap-create-user select, #ap-bulk-create select { min-height: 27px; }
  #ap-ai-config-form label { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; }
  .ap-status { color: var(--dim); font-size: 12px; margin-top: 6px; min-height: 1em; }
  .ap-status.ap-error { color: var(--bad); }
  #ap-denied { display: none; color: var(--bad); margin-top: 40px; text-align: center; }
  .ap-hosts-cell { position: relative; }
  .ap-hosts-summary { cursor: pointer; text-decoration: underline dotted; }
  .ap-hosts-popover {
    display: none; position: absolute; z-index: 5; top: 100%; left: 0; margin-top: 4px;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 10px; min-width: 180px; max-height: 220px; overflow-y: auto; font-size: 12px;
  }
  .ap-hosts-popover.ap-open { display: block; }
  .ap-hosts-popover label { display: flex; align-items: center; gap: 6px; padding: 2px 0; white-space: nowrap; }
  .ap-hosts-popover hr { border: none; border-top: 1px solid var(--border); margin: 6px 0; }
  #ap-bulk-create textarea {
    width: 100%; min-height: 90px; font-family: inherit; font-size: 13px; box-sizing: border-box;
    background: var(--panel-2); color: inherit; border: 1px solid var(--border); border-radius: 5px; padding: 6px 8px;
  }
  #ap-bulk-create-options { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; width: 100%; }
  #ap-bulk-results { list-style: none; margin: 10px 0 0; padding: 0; font-size: 12px; }
  #ap-bulk-results li { padding: 2px 0; }
  #ap-bulk-results li.ap-error { color: var(--bad); }
  #ap-logs-section .toolbar-btn { margin-right: 8px; }
  #ap-logs-summary {
    white-space: pre-wrap; margin-top: 12px; padding: 12px; border-radius: 5px;
    background: var(--panel-2); border: 1px solid var(--border); font-family: inherit;
    font-size: 13px; line-height: 1.5;
  }
</style>
</head>
<body>
<div id="ap">
  <div id="ap-head">
    <h1>Admin Panel</h1>
    <a href="/">Back to Ginnungagap</a>
  </div>

  <div id="ap-denied">You are not an admin on this installation.</div>

  <div id="ap-content">
    <section id="ap-users-section">
      <h2>User accounts</h2>
      <table>
        <thead><tr><th>Username</th><th>Role</th><th>Allowed hosts</th><th></th></tr></thead>
        <tbody id="ap-users-body"></tbody>
      </table>
      <form id="ap-create-user">
        <input type="text" id="ap-new-username" placeholder="Username" required autocomplete="off">
        <input type="password" id="ap-new-password" placeholder="Password (min. 8 characters)" required autocomplete="new-password">
        <select id="ap-new-role">
          <option value="user">user</option>
          <option value="readonly">readonly</option>
          <option value="admin">admin</option>
        </select>
        <span id="ap-new-hosts-control"></span>
        <button class="toolbar-btn primary" type="submit">Add user</button>
      </form>
      <p class="ap-status" id="ap-users-status"></p>
    </section>

    <section id="ap-bulk-section">
      <h2>Bulk add users</h2>
      <form id="ap-bulk-create">
        <textarea id="ap-bulk-lines" placeholder="One account per line: username;password&#10;alice;secret123&#10;bob;anotherpass" required></textarea>
        <div id="ap-bulk-create-options">
          <select id="ap-bulk-role">
            <option value="user">user</option>
            <option value="readonly">readonly</option>
            <option value="admin">admin</option>
          </select>
          <span id="ap-bulk-hosts-control"></span>
          <button class="toolbar-btn primary" type="submit">Import</button>
        </div>
      </form>
      <p class="ap-status" id="ap-bulk-status"></p>
      <ul id="ap-bulk-results"></ul>
    </section>

    <section id="ap-ai-config-section">
      <h2>AI configuration</h2>
      <form id="ap-ai-config-form">
        <label><input id="ap-ai-config-enabled" type="checkbox" disabled> Allow AI configuration in Config Push</label>
        <button class="toolbar-btn primary" type="submit" disabled>Save</button>
      </form>
      <p class="ap-status" id="ap-ai-config-status" role="status"></p>
    </section>

    <section id="ap-logs-section">
      <h2>Logs</h2>
      <a class="toolbar-btn" id="ap-logs-export" href="/logs/download" download="topologyoperator.log">Export logs</a>
      <button class="toolbar-btn primary" id="ap-logs-summarize" type="button">Summarize with AI</button>
      <p class="ap-status" id="ap-logs-status"></p>
      <pre id="ap-logs-summary" hidden></pre>
    </section>

    <section id="ap-audit-section">
      <h2>Audit log</h2>
      <table>
        <thead><tr><th>Time</th><th>Event</th><th>Username</th><th>Detail</th></tr></thead>
        <tbody id="ap-audit-body"></tbody>
      </table>
      <p class="ap-status" id="ap-audit-status"></p>
    </section>
  </div>
</div>
<script src="/admin.js?v=ginnungagap-55"></script>
</body>
</html>
