<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TopologyOperator</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/xterm/6.0.0/xterm.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xterm/6.0.0/xterm.js"></script>
<script type="module">
  import RFB from "https://cdn.jsdelivr.net/gh/novnc/noVNC@v1.7.0/core/rfb.js";
  window.RFB = RFB;
</script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1115;
    --panel: #161923;
    --border: #2a2f3d;
    --text: #e4e6eb;
    --dim: #8b93a7;
    --accent: #4f8cff;
    --ok: #3ecf8e;
    --warn: #e0a63e;
    --bad: #e05a5a;
  }
  * { box-sizing: border-box; }
  /* Without this, an element with an ID-selector display rule (flex,
     block, ...) stays visible despite the `hidden` attribute - the
     browser's own [hidden] default rule loses the specificity fight
     against any #id{display:...} rule. Hit both #node-actions and
     #console-header this session. */
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; }
  header .meta { font-size: 12px; color: var(--dim); }
  #warning-banner {
    padding: 8px 20px;
    background: #3a2c14;
    color: var(--warn);
    font-size: 13px;
    border-bottom: 1px solid var(--border);
  }
  #warning-banner:empty { display: none; }
  main {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  #canvas-area {
    width: 62%;
    border-right: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }
  #canvas { width: 100%; height: 100%; display: block; cursor: grab; }
  #canvas.panning { cursor: grabbing; }
  .node-shape { cursor: pointer; }
  .node-shape rect { stroke-width: 1.5; fill: var(--panel); }
  .node-shape.selected rect { stroke-width: 3; }
  .node-shape text { fill: var(--text); font-size: 11px; pointer-events: none; user-select: none; }
  .node-shape .role-badge { fill: var(--dim); font-size: 9px; }
  .role-ROUTER rect { stroke: #4f8cff; }
  .role-SWITCH rect { stroke: #3ecf8e; }
  .role-PC rect { stroke: #8b93a7; }
  .role-FW rect { stroke: #e05a5a; }
  .role-VM rect { stroke: #b06fe0; stroke-dasharray: 4 2; }
  .link-line { stroke: var(--border); stroke-width: 1.5; }
  .env-tag {
    font-size: 11px;
    color: var(--dim);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
  }
  button.console-btn {
    font-size: 12px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 4px 10px;
    cursor: pointer;
  }
  button.console-btn:disabled { background: var(--border); color: var(--dim); cursor: not-allowed; }
  #node-actions {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #console-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  #console-header {
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    color: var(--dim);
    display: flex;
    justify-content: space-between;
  }
  #console-placeholder {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--dim);
    font-size: 13px;
  }
  #terminal { flex: 1; padding: 8px; min-height: 0; }
  #terminal:empty { display: none; }
  #vm-screen-container { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: auto; }
  #vm-screen-container canvas { max-width: 100%; }
  header button.tab-btn {
    font-size: 12px;
    background: none;
    color: var(--dim);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 10px;
    cursor: pointer;
    margin-left: auto;
  }
  header button.tab-btn.active { color: var(--text); border-color: var(--accent); }
  #push-area { flex: 1; display: flex; flex-direction: column; min-width: 0; padding: 16px; overflow-y: auto; }
  #push-area textarea {
    width: 100%;
    height: 140px;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px;
    font-family: ui-monospace, monospace;
    font-size: 12px;
    resize: vertical;
  }
  #push-area button.push-btn {
    align-self: flex-start;
    margin-top: 8px;
    font-size: 13px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 6px 14px;
    cursor: pointer;
  }
  #push-results { margin-top: 16px; font-size: 13px; }
  .device-result { border: 1px solid var(--border); border-radius: 4px; margin-bottom: 8px; overflow: hidden; }
  .device-result-header { padding: 6px 10px; display: flex; justify-content: space-between; background: var(--panel); }
  .device-result-header.ok { border-left: 3px solid var(--ok); }
  .device-result-header.fail { border-left: 3px solid var(--bad); }
  .device-result table { font-size: 12px; }
  .device-result td { border-bottom: 1px solid var(--border); }
  .cmd-ok { color: var(--ok); }
  .cmd-fail { color: var(--bad); }
</style>
</head>
<body>
<header>
  <h1>TopologyOperator</h1>
  <span class="meta" id="project-meta"></span>
  <button class="tab-btn active" id="tab-console">Console</button>
  <button class="tab-btn" id="tab-push">Config Push</button>
</header>
<div id="warning-banner"></div>
<main>
  <div id="canvas-area">
    <svg id="canvas" viewBox="0 0 1600 900">
      <g id="links-layer"></g>
      <g id="nodes-layer"></g>
    </svg>
  </div>
  <div id="console-area">
    <div id="node-actions" hidden>
      <span class="env-tag" id="selected-role"></span>
      <strong id="selected-name"></strong>
      <span id="selected-status" style="color: var(--dim);"></span>
      <button class="console-btn" id="selected-action-btn" style="margin-left: auto;"></button>
    </div>
    <div id="console-header" hidden>
      <span id="console-title"></span>
      <span id="console-status"></span>
    </div>
    <div id="console-placeholder">Click a node on the canvas to see its details here.</div>
    <div id="terminal"></div>
    <div id="vm-screen-container"></div>
  </div>
  <div id="push-area" hidden>
    <p style="color: var(--dim); font-size: 13px; margin-top: 0;">
      Paste a devices object (device name → list of raw commands, sent
      verbatim - same shape as the project's config-push YAML file's
      <code>devices:</code> key, as JSON here) and push.
    </p>
    <textarea id="push-input">{
  "R1": ["show version"]
}</textarea>
    <button class="push-btn" id="push-btn">Push</button>
    <div id="push-results"></div>
  </div>
</main>

<script>
let term = null;
let ws = null;
let rfb = null;

function closeViewers() {
  if (ws) { ws.close(); ws = null; }
  if (rfb) { rfb.disconnect(); rfb = null; }
  document.getElementById("terminal").style.display = "none";
  document.getElementById("vm-screen-container").style.display = "none";
}

const NODE_W = 70;
const NODE_H = 44;
const ROLE_BADGES = { ROUTER: "RT", SWITCH: "SW", PC: "PC", FW: "FW", VM: "VM" };

let nodesData = {};      // name -> {name, role, environment, interfaces, live, x, y}
let selectedName = null;

async function loadCanvas() {
  const [health, topology, nodesResult, positions] = await Promise.all([
    fetch("/health").then(r => r.json()),
    fetch("/topology").then(r => r.json()),
    fetch("/nodes").then(r => r.ok ? r.json() : null),
    fetch("/layout").then(r => r.json()),
  ]);

  document.getElementById("project-meta").textContent =
    `${health.gns3_project_name} @ ${health.esxi_ip}`;
  document.getElementById("warning-banner").textContent = health.warning || "";

  const liveByName = new Map((nodesResult || []).map(n => [n.name, n]));
  nodesData = {};
  for (const node of topology) {
    const pos = positions[node.name] || { x: 100, y: 100 };
    nodesData[node.name] = { ...node, live: liveByName.get(node.name) || null, x: pos.x, y: pos.y };
  }
  renderCanvas();
}

function renderCanvas() {
  const linksLayer = document.getElementById("links-layer");
  const nodesLayer = document.getElementById("nodes-layer");
  linksLayer.innerHTML = "";
  nodesLayer.innerHTML = "";

  const drawnPairs = new Set();
  for (const node of Object.values(nodesData)) {
    for (const neighbourName of Object.values(node.interfaces)) {
      if (!neighbourName || !nodesData[neighbourName]) continue;
      const pairKey = [node.name, neighbourName].sort().join("|");
      if (drawnPairs.has(pairKey)) continue;
      drawnPairs.add(pairKey);
      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("class", "link-line");
      line.dataset.pair = pairKey;
      setLineEndpoints(line, node, nodesData[neighbourName]);
      linksLayer.appendChild(line);
    }
  }

  for (const node of Object.values(nodesData)) {
    nodesLayer.appendChild(buildNodeShape(node));
  }
}

function setLineEndpoints(line, a, b) {
  line.setAttribute("x1", a.x);
  line.setAttribute("y1", a.y);
  line.setAttribute("x2", b.x);
  line.setAttribute("y2", b.y);
}

function buildNodeShape(node) {
  const isVM = node.environment === "ON_ESXI";
  const roleClass = isVM ? "role-VM" : `role-${node.role}`;
  const status = node.live && node.live.status ? node.live.status : "none";
  const running = status === "started" || status === "poweredOn";

  const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
  g.setAttribute("class", `node-shape ${roleClass}${node.name === selectedName ? " selected" : ""}`);
  g.setAttribute("transform", `translate(${node.x - NODE_W / 2}, ${node.y - NODE_H / 2})`);
  g.dataset.name = node.name;

  const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
  rect.setAttribute("width", NODE_W);
  rect.setAttribute("height", NODE_H);
  rect.setAttribute("rx", 6);
  rect.setAttribute("fill", running ? "#1c3d2e" : "var(--panel)");
  g.appendChild(rect);

  const badge = document.createElementNS("http://www.w3.org/2000/svg", "text");
  badge.setAttribute("class", "role-badge");
  badge.setAttribute("x", 6);
  badge.setAttribute("y", 14);
  badge.textContent = ROLE_BADGES[node.role] || node.role.slice(0, 2).toUpperCase();
  g.appendChild(badge);

  const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
  label.setAttribute("x", NODE_W / 2);
  label.setAttribute("y", NODE_H - 8);
  label.setAttribute("text-anchor", "middle");
  label.textContent = node.name;
  g.appendChild(label);

  g.addEventListener("pointerdown", (evt) => startNodeDrag(evt, node.name));
  return g;
}

const svg = document.getElementById("canvas");
let viewBoxState = { x: 0, y: 0, w: 1600, h: 900 };

function applyViewBox() {
  svg.setAttribute("viewBox", `${viewBoxState.x} ${viewBoxState.y} ${viewBoxState.w} ${viewBoxState.h}`);
}

function svgPoint(evt) {
  const pt = svg.createSVGPoint();
  pt.x = evt.clientX;
  pt.y = evt.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}

let dragState = null;

function startNodeDrag(evt, name) {
  evt.stopPropagation();
  const node = nodesData[name];
  const p = svgPoint(evt);
  dragState = { name, offsetX: p.x - node.x, offsetY: p.y - node.y, moved: false };
  selectNode(name);
  window.addEventListener("pointermove", onNodeDrag);
  window.addEventListener("pointerup", endNodeDrag);
}

function onNodeDrag(evt) {
  if (!dragState) return;
  dragState.moved = true;
  const p = svgPoint(evt);
  const node = nodesData[dragState.name];
  node.x = p.x - dragState.offsetX;
  node.y = p.y - dragState.offsetY;

  const g = document.querySelector(`.node-shape[data-name="${dragState.name}"]`);
  g.setAttribute("transform", `translate(${node.x - NODE_W / 2}, ${node.y - NODE_H / 2})`);

  document.querySelectorAll(".link-line").forEach((line) => {
    const [a, b] = line.dataset.pair.split("|");
    if (a !== dragState.name && b !== dragState.name) return;
    const other = a === dragState.name ? b : a;
    setLineEndpoints(line, node, nodesData[other]);
  });
}

function endNodeDrag() {
  window.removeEventListener("pointermove", onNodeDrag);
  window.removeEventListener("pointerup", endNodeDrag);
  if (dragState && dragState.moved) {
    const node = nodesData[dragState.name];
    fetch("/layout", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: dragState.name, x: node.x, y: node.y }),
    });
  }
  dragState = null;
}

svg.addEventListener("wheel", (evt) => {
  evt.preventDefault();
  const p = svgPoint(evt);
  const scale = evt.deltaY > 0 ? 1.1 : 0.9;
  viewBoxState.x = p.x - (p.x - viewBoxState.x) * scale;
  viewBoxState.y = p.y - (p.y - viewBoxState.y) * scale;
  viewBoxState.w *= scale;
  viewBoxState.h *= scale;
  applyViewBox();
});

let panState = null;
svg.addEventListener("pointerdown", (evt) => {
  if (evt.target !== svg) return;
  panState = { startX: evt.clientX, startY: evt.clientY, startVB: { ...viewBoxState } };
  svg.classList.add("panning");
});
window.addEventListener("pointermove", (evt) => {
  if (!panState) return;
  const dx = (evt.clientX - panState.startX) * (viewBoxState.w / svg.clientWidth);
  const dy = (evt.clientY - panState.startY) * (viewBoxState.h / svg.clientHeight);
  viewBoxState.x = panState.startVB.x - dx;
  viewBoxState.y = panState.startVB.y - dy;
  applyViewBox();
});
window.addEventListener("pointerup", () => {
  if (panState) {
    panState = null;
    svg.classList.remove("panning");
  }
});

function selectNode(name) {
  selectedName = name;
  document.querySelectorAll(".node-shape").forEach((g) => {
    g.classList.toggle("selected", g.dataset.name === name);
  });
  showNodeActions(name);
}

function showNodeActions(name) {
  const node = nodesData[name];
  const isVM = node.environment === "ON_ESXI";
  const live = node.live;
  const status = live && live.status ? live.status : "none";

  document.getElementById("console-placeholder").style.display = "none";
  document.getElementById("node-actions").hidden = false;
  document.getElementById("selected-role").textContent = node.environment.replace("ON_", "");
  document.getElementById("selected-name").textContent = node.name;
  document.getElementById("selected-status").textContent = `(${node.role}, ${status})`;

  const btn = document.getElementById("selected-action-btn");
  const canConsole = !isVM && live && live.console_type === "telnet" && live.status === "started";
  const canScreen = isVM && live && live.status === "poweredOn";
  btn.textContent = isVM ? "Screen" : "Console";
  btn.disabled = isVM ? !canScreen : !canConsole;
  btn.title = isVM
    ? (canScreen ? "Open this VM's screen" : `VM status: ${status}`)
    : (canConsole ? "Open this node's console" : (live ? `console type: ${live.console_type || "n/a"}, status: ${status}` : "no live data"));
  btn.onclick = () => (isVM ? openScreen(name) : openConsole(name));

  showTab("console");
}

function openConsole(nodeName) {
  closeViewers();
  document.getElementById("console-placeholder").style.display = "none";
  const header = document.getElementById("console-header");
  header.hidden = false;
  document.getElementById("console-title").textContent = nodeName;
  const statusEl = document.getElementById("console-status");
  statusEl.textContent = "connecting…";

  const termEl = document.getElementById("terminal");
  termEl.style.display = "block";
  termEl.innerHTML = "";
  if (term) term.dispose();
  term = new Terminal({ convertEol: true, fontSize: 13, theme: { background: "#0f1115" } });
  term.open(termEl);

  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  ws = new WebSocket(`${proto}//${location.host}/ws/console/${encodeURIComponent(nodeName)}`);
  ws.binaryType = "arraybuffer";

  ws.onopen = () => { statusEl.textContent = "connected"; };
  ws.onmessage = (event) => { term.write(new Uint8Array(event.data)); };
  ws.onclose = (event) => {
    statusEl.textContent = event.reason ? `closed: ${event.reason}` : "closed";
  };
  ws.onerror = () => { statusEl.textContent = "error"; };

  term.onData((data) => {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(new TextEncoder().encode(data));
    }
  });
}

async function openScreen(nodeName) {
  closeViewers();
  document.getElementById("console-placeholder").style.display = "none";
  const header = document.getElementById("console-header");
  header.hidden = false;
  document.getElementById("console-title").textContent = nodeName;
  const statusEl = document.getElementById("console-status");
  statusEl.textContent = "preparing (may power-cycle the VM on first use)…";

  const screenEl = document.getElementById("vm-screen-container");
  screenEl.style.display = "flex";
  screenEl.innerHTML = "";

  let password;
  try {
    const resp = await fetch(`/vm-screen/${encodeURIComponent(nodeName)}/prepare`, { method: "POST" });
    if (!resp.ok) {
      statusEl.textContent = `prepare failed: HTTP ${resp.status} ${await resp.text()}`;
      return;
    }
    const data = await resp.json();
    password = data.password;
    if (data.power_cycled) {
      statusEl.textContent = "VM was power-cycled to enable its screen, connecting…";
    }
  } catch (err) {
    statusEl.textContent = `prepare failed: ${err}`;
    return;
  }

  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const url = `${proto}//${location.host}/ws/vm-screen/${encodeURIComponent(nodeName)}`;
  rfb = new RFB(screenEl, url, { credentials: { password } });
  rfb.addEventListener("connect", () => { statusEl.textContent = "connected"; });
  rfb.addEventListener("disconnect", (e) => {
    statusEl.textContent = e.detail.clean ? "closed" : "connection lost";
  });
  rfb.addEventListener("securityfailure", (e) => {
    statusEl.textContent = `auth failed: ${e.detail.reason || e.detail.status}`;
  });
}

document.getElementById("tab-console").addEventListener("click", () => showTab("console"));
document.getElementById("tab-push").addEventListener("click", () => showTab("push"));

function showTab(name) {
  document.getElementById("console-area").hidden = name !== "console";
  document.getElementById("push-area").hidden = name !== "push";
  document.getElementById("tab-console").classList.toggle("active", name === "console");
  document.getElementById("tab-push").classList.toggle("active", name === "push");
}

document.getElementById("push-btn").addEventListener("click", async () => {
  const resultsEl = document.getElementById("push-results");
  let devices;
  try {
    devices = JSON.parse(document.getElementById("push-input").value);
  } catch (err) {
    resultsEl.textContent = `Invalid JSON: ${err}`;
    return;
  }
  resultsEl.textContent = "Pushing…";

  let deviceResults;
  try {
    const resp = await fetch("/config-push", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ devices }),
    });
    if (!resp.ok) {
      resultsEl.textContent = `Request failed: HTTP ${resp.status}`;
      return;
    }
    deviceResults = await resp.json();
  } catch (err) {
    resultsEl.textContent = `Request failed: ${err}`;
    return;
  }

  resultsEl.innerHTML = "";
  for (const result of deviceResults) {
    const box = document.createElement("div");
    box.className = "device-result";
    const header = document.createElement("div");
    header.className = `device-result-header ${result.ok ? "ok" : "fail"}`;
    header.innerHTML = `<span>${result.device} <span class="env-tag">${result.transport}</span></span><span>${result.ok ? "ok" : "failed"}</span>`;
    box.appendChild(header);

    if (result.error) {
      const err = document.createElement("div");
      err.style.padding = "6px 10px";
      err.style.color = "var(--bad)";
      err.textContent = result.error;
      box.appendChild(err);
    }
    if (result.commands && result.commands.length) {
      const table = document.createElement("table");
      table.innerHTML = result.commands.map(c => `
        <tr>
          <td class="${c.ok ? "cmd-ok" : "cmd-fail"}">${c.ok ? "✓" : "✗"}</td>
          <td>${c.command}</td>
          <td style="color: var(--dim)">${(c.output || "").slice(0, 200)}</td>
        </tr>
      `).join("");
      box.appendChild(table);
    }
    resultsEl.appendChild(box);
  }
});

loadCanvas().catch((err) => {
  document.getElementById("warning-banner").textContent = `Failed to load: ${err}`;
});
</script>
</body>
</html>
