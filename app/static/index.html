<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TopologyOperator</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/xterm/6.0.0/xterm.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xterm/6.0.0/xterm.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1115;
    --panel: #161923;
    --border: #2a2f3d;
    --text: #e4e6eb;
    --dim: #8b93a7;
    --accent: #4f8cff;
    --ok: #3ecf8e;
    --warn: #e0a63e;
    --bad: #e05a5a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; }
  header .meta { font-size: 12px; color: var(--dim); }
  #warning-banner {
    padding: 8px 20px;
    background: #3a2c14;
    color: var(--warn);
    font-size: 13px;
    border-bottom: 1px solid var(--border);
  }
  #warning-banner:empty { display: none; }
  main {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  #node-list {
    width: 420px;
    overflow-y: auto;
    border-right: 1px solid var(--border);
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); }
  th { color: var(--dim); font-weight: 500; position: sticky; top: 0; background: var(--panel); }
  .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .status-started { background: var(--ok); }
  .status-stopped, .status-none { background: var(--dim); }
  .env-tag {
    font-size: 11px;
    color: var(--dim);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
  }
  button.console-btn {
    font-size: 12px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 4px 10px;
    cursor: pointer;
  }
  button.console-btn:disabled { background: var(--border); color: var(--dim); cursor: not-allowed; }
  #console-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  #console-header {
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    color: var(--dim);
    display: flex;
    justify-content: space-between;
  }
  #console-placeholder {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--dim);
    font-size: 13px;
  }
  #terminal { flex: 1; padding: 8px; min-height: 0; }
  #terminal:empty { display: none; }
  header button.tab-btn {
    font-size: 12px;
    background: none;
    color: var(--dim);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 10px;
    cursor: pointer;
    margin-left: auto;
  }
  header button.tab-btn.active { color: var(--text); border-color: var(--accent); }
  #push-area { flex: 1; display: flex; flex-direction: column; min-width: 0; padding: 16px; overflow-y: auto; }
  #push-area textarea {
    width: 100%;
    height: 140px;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px;
    font-family: ui-monospace, monospace;
    font-size: 12px;
    resize: vertical;
  }
  #push-area button.push-btn {
    align-self: flex-start;
    margin-top: 8px;
    font-size: 13px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 6px 14px;
    cursor: pointer;
  }
  #push-results { margin-top: 16px; font-size: 13px; }
  .device-result { border: 1px solid var(--border); border-radius: 4px; margin-bottom: 8px; overflow: hidden; }
  .device-result-header { padding: 6px 10px; display: flex; justify-content: space-between; background: var(--panel); }
  .device-result-header.ok { border-left: 3px solid var(--ok); }
  .device-result-header.fail { border-left: 3px solid var(--bad); }
  .device-result table { font-size: 12px; }
  .device-result td { border-bottom: 1px solid var(--border); }
  .cmd-ok { color: var(--ok); }
  .cmd-fail { color: var(--bad); }
</style>
</head>
<body>
<header>
  <h1>TopologyOperator</h1>
  <span class="meta" id="project-meta"></span>
  <button class="tab-btn active" id="tab-console">Console</button>
  <button class="tab-btn" id="tab-push">Config Push</button>
</header>
<div id="warning-banner"></div>
<main>
  <div id="node-list">
    <table>
      <thead>
        <tr><th>Node</th><th>Role</th><th>Env</th><th></th></tr>
      </thead>
      <tbody id="node-rows"></tbody>
    </table>
  </div>
  <div id="console-area">
    <div id="console-header" hidden>
      <span id="console-title"></span>
      <span id="console-status"></span>
    </div>
    <div id="console-placeholder">Select a node's Console button to open it here.</div>
    <div id="terminal"></div>
  </div>
  <div id="push-area" hidden>
    <p style="color: var(--dim); font-size: 13px; margin-top: 0;">
      Paste a devices object (device name → list of raw commands, sent
      verbatim - same shape as the project's config-push YAML file's
      <code>devices:</code> key, as JSON here) and push.
    </p>
    <textarea id="push-input">{
  "R1": ["show version"]
}</textarea>
    <button class="push-btn" id="push-btn">Push</button>
    <div id="push-results"></div>
  </div>
</main>

<script>
let term = null;
let ws = null;

async function loadNodes() {
  const [health, topology, nodesResult] = await Promise.all([
    fetch("/health").then(r => r.json()),
    fetch("/topology").then(r => r.json()),
    fetch("/nodes").then(r => r.ok ? r.json() : null),
  ]);

  document.getElementById("project-meta").textContent =
    `${health.gns3_project_name} @ ${health.esxi_ip}`;
  document.getElementById("warning-banner").textContent = health.warning || "";

  const liveByName = new Map((nodesResult || []).map(n => [n.name, n]));
  const rows = document.getElementById("node-rows");
  rows.innerHTML = "";

  for (const node of topology) {
    const live = liveByName.get(node.name);
    const status = live && live.status ? live.status : "none";
    const canConsole = live && live.console_type === "telnet" && live.status === "started";

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><span class="status-dot status-${status}"></span>${node.name}</td>
      <td>${node.role}</td>
      <td><span class="env-tag">${node.environment.replace("ON_", "")}</span></td>
      <td></td>
    `;
    const cell = tr.querySelector("td:last-child");
    const btn = document.createElement("button");
    btn.className = "console-btn";
    btn.textContent = "Console";
    btn.disabled = !canConsole;
    btn.title = canConsole
      ? "Open this node's console"
      : (live ? `console type: ${live.console_type || "n/a"}, status: ${status}` : "no live data");
    btn.addEventListener("click", () => openConsole(node.name));
    cell.appendChild(btn);
    rows.appendChild(tr);
  }
}

function openConsole(nodeName) {
  if (ws) {
    ws.close();
    ws = null;
  }
  document.getElementById("console-placeholder").style.display = "none";
  const header = document.getElementById("console-header");
  header.hidden = false;
  document.getElementById("console-title").textContent = nodeName;
  const statusEl = document.getElementById("console-status");
  statusEl.textContent = "connecting…";

  const termEl = document.getElementById("terminal");
  termEl.innerHTML = "";
  if (term) term.dispose();
  term = new Terminal({ convertEol: true, fontSize: 13, theme: { background: "#0f1115" } });
  term.open(termEl);

  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  ws = new WebSocket(`${proto}//${location.host}/ws/console/${encodeURIComponent(nodeName)}`);
  ws.binaryType = "arraybuffer";

  ws.onopen = () => { statusEl.textContent = "connected"; };
  ws.onmessage = (event) => { term.write(new Uint8Array(event.data)); };
  ws.onclose = (event) => {
    statusEl.textContent = event.reason ? `closed: ${event.reason}` : "closed";
  };
  ws.onerror = () => { statusEl.textContent = "error"; };

  term.onData((data) => {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(new TextEncoder().encode(data));
    }
  });
}

document.getElementById("tab-console").addEventListener("click", () => showTab("console"));
document.getElementById("tab-push").addEventListener("click", () => showTab("push"));

function showTab(name) {
  document.getElementById("console-area").hidden = name !== "console";
  document.getElementById("push-area").hidden = name !== "push";
  document.getElementById("tab-console").classList.toggle("active", name === "console");
  document.getElementById("tab-push").classList.toggle("active", name === "push");
}

document.getElementById("push-btn").addEventListener("click", async () => {
  const resultsEl = document.getElementById("push-results");
  let devices;
  try {
    devices = JSON.parse(document.getElementById("push-input").value);
  } catch (err) {
    resultsEl.textContent = `Invalid JSON: ${err}`;
    return;
  }
  resultsEl.textContent = "Pushing…";

  let deviceResults;
  try {
    const resp = await fetch("/config-push", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ devices }),
    });
    if (!resp.ok) {
      resultsEl.textContent = `Request failed: HTTP ${resp.status}`;
      return;
    }
    deviceResults = await resp.json();
  } catch (err) {
    resultsEl.textContent = `Request failed: ${err}`;
    return;
  }

  resultsEl.innerHTML = "";
  for (const result of deviceResults) {
    const box = document.createElement("div");
    box.className = "device-result";
    const header = document.createElement("div");
    header.className = `device-result-header ${result.ok ? "ok" : "fail"}`;
    header.innerHTML = `<span>${result.device} <span class="env-tag">${result.transport}</span></span><span>${result.ok ? "ok" : "failed"}</span>`;
    box.appendChild(header);

    if (result.error) {
      const err = document.createElement("div");
      err.style.padding = "6px 10px";
      err.style.color = "var(--bad)";
      err.textContent = result.error;
      box.appendChild(err);
    }
    if (result.commands && result.commands.length) {
      const table = document.createElement("table");
      table.innerHTML = result.commands.map(c => `
        <tr>
          <td class="${c.ok ? "cmd-ok" : "cmd-fail"}">${c.ok ? "✓" : "✗"}</td>
          <td>${c.command}</td>
          <td style="color: var(--dim)">${(c.output || "").slice(0, 200)}</td>
        </tr>
      `).join("");
      box.appendChild(table);
    }
    resultsEl.appendChild(box);
  }
});

loadNodes().catch((err) => {
  document.getElementById("warning-banner").textContent = `Failed to load: ${err}`;
});
</script>
</body>
</html>
