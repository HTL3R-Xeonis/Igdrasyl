<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ginnungagap - Logs</title>
<link rel="icon" type="image/svg+xml" href="/ginnungagap-mark.svg">
<link rel="stylesheet" href="/styles.css?v=ginnungagap-60">
<style>
  /* styles.css lays <body> out for the single-page app (full height, no
     scrolling) - this page is its own document. */
  body { display: block; height: auto; min-height: 100vh; overflow: auto; }
  #lp { display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; padding: 14px 18px; gap: 10px; }
  #lp-head { display: flex; align-items: baseline; gap: 16px; flex-shrink: 0; }
  #lp-head h1 { margin: 0; font-size: 18px; font-weight: 500; }
  #lp-head a { color: var(--dim); font-size: 12px; }
  #lp-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; flex-shrink: 0; }
  #lp-toolbar label { display: inline-flex; align-items: center; gap: 6px; color: var(--dim); font-size: 12px; }
  #lp-toolbar select, #lp-toolbar input[type="search"] {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 2px; padding: 4px 8px; min-height: 27px; box-sizing: border-box;
  }
  #lp-search { width: 240px; max-width: 100%; }
  #lp-info { color: var(--dim); font-size: 12px; flex-shrink: 0; }
  #lp-info .lp-warn { color: var(--warn); }
  #lp-output {
    flex: 1; min-height: 0; overflow: auto; background: var(--bg); border: 1px solid var(--border);
    border-radius: 5px; padding: 8px; font-family: ui-monospace, monospace; font-size: 12px; line-height: 1.5;
  }
  #lp-output .log-line { margin-bottom: 3px; }
  #lp-empty { color: var(--dim); padding: 8px; }
</style>
</head>
<body>
<div id="lp">
  <div id="lp-head">
    <h1>Logs</h1>
    <a href="/">Back to Ginnungagap</a>
  </div>

  <div id="lp-toolbar">
    <label>Level
      <select id="lp-level">
        <option value="">All (incl. debug)</option>
        <option value="INFO">Info and above</option>
        <option value="WARNING">Warnings and errors</option>
        <option value="ERROR">Errors only</option>
      </select>
    </label>
    <label>Search
      <input type="search" id="lp-search" placeholder="text in any field" autocomplete="off">
    </label>
    <label>Show
      <select id="lp-lines">
        <option value="200">200</option>
        <option value="500" selected>500</option>
        <option value="2000">2 000</option>
        <option value="10000">10 000</option>
        <option value="100000">everything (100 000)</option>
      </select>
      entries
    </label>
    <label><input type="checkbox" id="lp-auto" checked> Auto-refresh</label>
    <label><input type="checkbox" id="lp-follow" checked> Follow newest</label>
    <button class="toolbar-btn" id="lp-refresh" type="button">Refresh</button>
    <button class="toolbar-btn" id="lp-clear" type="button">Clear logs</button>
    <a class="toolbar-btn" id="lp-download" href="/logs/download" download="topologyoperator.log">Download</a>
  </div>

  <div id="lp-info"></div>
  <div id="lp-output" role="log" aria-live="off"></div>
</div>

<script>
(() => {
  const REFRESH_MS = 5000;
  const SEARCH_DEBOUNCE_MS = 300;
  const $ = (id) => document.getElementById(id);
  const out = $("lp-output");

  // Remembered per browser; a blocked/absent store just means defaults.
  const store = {
    get(key, fallback) { try { return localStorage.getItem("logs." + key) ?? fallback; } catch { return fallback; } },
    set(key, value) { try { localStorage.setItem("logs." + key, value); } catch { /* private mode */ }
    },
  };
  $("lp-level").value = store.get("level", "");
  $("lp-lines").value = store.get("lines", "500");
  $("lp-auto").checked = store.get("auto", "1") === "1";
  $("lp-follow").checked = store.get("follow", "1") === "1";

  let timer = null;
  let loading = false;

  function entryNode(entry) {
    const div = document.createElement("div");
    div.className = "log-line";
    if (!entry.level) {
      div.classList.add("log-line-raw");
      div.textContent = entry.message;
      return div;
    }
    const meta = document.createElement("div");
    meta.className = "log-line-meta";
    for (const [cls, text] of [
      ["log-line-time", entry.time],
      ["log-line-level log-level-" + entry.level, entry.level],
      ["log-line-location", entry.location],
    ]) {
      const span = document.createElement("span");
      span.className = cls;
      span.textContent = text;
      meta.appendChild(span);
    }
    const message = document.createElement("div");
    message.className = "log-line-message";
    message.textContent = entry.message;
    div.append(meta, message);
    return div;
  }

  function showInfo(info, shown) {
    const el = $("lp-info");
    el.replaceChildren();
    const used = document.createElement("span");
    used.textContent = `${shown.toLocaleString()} entries shown - ${info.lines.toLocaleString()} of ${info.max_lines.toLocaleString()} lines on disk`;
    el.appendChild(used);
    if (info.lines >= info.max_lines * 0.9) {
      const warn = document.createElement("span");
      warn.className = "lp-warn";
      warn.textContent = " - nearly full, the oldest lines are dropped as new ones arrive";
      el.appendChild(warn);
    }
  }

  async function load() {
    if (loading) return;
    loading = true;
    const params = new URLSearchParams({ lines: $("lp-lines").value });
    if ($("lp-level").value) params.set("level", $("lp-level").value);
    if ($("lp-search").value.trim()) params.set("search", $("lp-search").value.trim());
    try {
      const resp = await fetch("/logs/entries?" + params);
      if (!resp.ok) throw new Error((await resp.json().catch(() => ({}))).detail || resp.status);
      const { entries, info } = await resp.json();
      const nearBottom = out.scrollHeight - out.scrollTop - out.clientHeight < 40;
      out.replaceChildren();
      if (!entries.length) {
        const empty = document.createElement("div");
        empty.id = "lp-empty";
        empty.textContent = "No log entries match.";
        out.appendChild(empty);
      } else {
        const fragment = document.createDocumentFragment();
        for (const entry of entries) fragment.appendChild(entryNode(entry));
        out.appendChild(fragment);
      }
      if ($("lp-follow").checked && (nearBottom || out.scrollTop === 0)) out.scrollTop = out.scrollHeight;
      showInfo(info, entries.length);
    } catch (err) {
      $("lp-info").textContent = `Couldn't load the logs: ${err.message || err}`;
    } finally {
      loading = false;
    }
  }

  function schedule() {
    clearInterval(timer);
    timer = $("lp-auto").checked ? setInterval(load, REFRESH_MS) : null;
  }

  let searchTimer = null;
  $("lp-search").addEventListener("input", () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(load, SEARCH_DEBOUNCE_MS);
  });
  $("lp-level").addEventListener("change", () => { store.set("level", $("lp-level").value); load(); });
  $("lp-lines").addEventListener("change", () => { store.set("lines", $("lp-lines").value); load(); });
  $("lp-auto").addEventListener("change", () => { store.set("auto", $("lp-auto").checked ? "1" : "0"); schedule(); });
  $("lp-follow").addEventListener("change", () => {
    store.set("follow", $("lp-follow").checked ? "1" : "0");
    if ($("lp-follow").checked) out.scrollTop = out.scrollHeight;
  });
  $("lp-refresh").addEventListener("click", load);
  $("lp-clear").addEventListener("click", async () => {
    if (!window.confirm("Delete all log entries permanently? This can't be undone.")) return;
    try {
      const resp = await fetch("/logs", { method: "DELETE" });
      if (!resp.ok) throw new Error((await resp.json().catch(() => ({}))).detail || resp.status);
    } catch (err) {
      $("lp-info").textContent = `Couldn't clear the logs: ${err.message || err}`;
      return;
    }
    load();
  });

  load();
  schedule();
})();
</script>
</body>
</html>
