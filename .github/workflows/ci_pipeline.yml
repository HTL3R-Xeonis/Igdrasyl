name: Python CI (Ruff & Tests)

on:
  push:
  pull_request:

# Read-only token; the pipeline needs nothing else (public repository).
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  tests_and_linter:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      # TESTS
      # LITERAL_API_VALUES makes template-lookup calls (Environment.
      # get_environment, via TopologyBuilder) return a hardcoded set
      # instead of hitting the real template-listing services - already
      # set unconditionally at the top of tests/conftest.py, listed here
      # too for clarity/in case that ever changes.
      - name: Execute tests with pytest
        env:
          LITERAL_API_VALUES: "true"
        run: pytest

      # LINTER
      - name: Install ruff
        run: pip install ruff

      - name: Ruff Check
        run: ruff check --output-format=github .

      - name: Ruff Format
        run: ruff format --output-format=github --diff --check .
