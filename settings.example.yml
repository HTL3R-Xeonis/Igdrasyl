# Optional settings overrides for TopologyOperator, loaded via the
# TOPOLOGYOPERATOR_SETTINGS env var (defaults to ./settings.yml).
# Copy this file to settings.yml (git-ignored) and fill in your own values.
#
# This reuses TopologyBuilder's own Settings class/YAML schema wholesale -
# TopologyOperator doesn't have a config format of its own, it just needs
# to point at the SAME topology file and infrastructure a TopologyBuilder
# deploy already used, so it can look up what's actually running.
# Passwords are intentionally NOT supported here - use the ESXI_PASSWORD/
# GNS3_PASSWORD environment variables instead (a .env file works too, see
# .env.example). GNS3_PASSWORD specifically is only needed for Phase B's
# write endpoints (add/remove node/link) - they SSH into the GNS3 VM to
# rebuild its VLAN trunk subinterfaces on every call. Read-only endpoints
# work fine without it.

# Path to the SAME topology YAML file a `topologybuilder deploy` already
# used - this is what TopologyOperator reads to know what nodes/edges
# should exist, before cross-referencing live GNS3/ESXi state.
topology_file: ./topology_example.yaml

# Whether importing a .topoproj bundle (POST /project/import) deploys
# incrementally. True (default) reuses anything already live by name and
# only creates what's new/changed, so one slow or failing device (e.g. a
# stuck OVA import) doesn't undo devices from the bundle that already
# deployed successfully - confirmed live: importing a bundle with one
# broken VM still left every other already-existing device untouched and
# working. Set to false for a full deploy instead: resets the ESXi
# vSwitch, deletes ESXi VMs/GNS3 projects not in the imported topology,
# and redeploys everything from scratch even if a same-named node already
# exists - slower and more disruptive to whatever's currently live, but
# guarantees a clean result with nothing left over from a previous
# import. Only affects /project/import - the canvas's own Add Node/Add
# Link always deploy incrementally regardless of this setting, since
# that's inherent to what those two operations are.
incremental_deploy: true

esxi:
  ip: 10.20.20.202
  username: root
  gns3_vm_name: GNS3-VM (1)
  # Must match the ESXi port group actually carrying the GNS3 VM's VLAN
  # trunk NIC on your host - defaults to "PG_GNS3_TRUNK" if omitted, which
  # won't match every host's naming (e.g. "PG-GNS3-TRUNK" with hyphens).
  # Phase B's write endpoints fail with "Could not auto-detect the GNS3
  # VM's trunk interface" if this doesn't match. Same value the
  # TopologyBuilder deploy that created this topology used.
  # trunk_port_group: PG-GNS3-TRUNK
  # Must be the SAME vSwitch the GNS3 VM's trunk port group actually
  # lives on - defaults to "internal_network" if omitted, which is only
  # right if that's genuinely where the trunk NIC is. A mismatch here is
  # silent: ESXi-hosted nodes deploy and power on fine, but their traffic
  # never reaches the GNS3 VM at all (two isolated vSwitches, no uplink
  # between them) - confirmed live the hard way. Same value the
  # TopologyBuilder deploy that created this topology used.
  # virtual_switch: vSwitch0

gns3:
  username: gns3
  # Must match the project name that deploy actually used - omit (or
  # comment out) to default to the topology file's own stem, same rule
  # TopologyBuilder itself uses.
  # project_name: tb_gns3_project
  port: 80

api:
  esxi_template_server_url: http://10.20.20.171:8000
  gns3_template_server_url: http://10.20.20.171:8001
