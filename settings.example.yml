# Optional settings overrides for TopologyOperator, loaded via the
# TOPOLOGYOPERATOR_SETTINGS env var.
# Copy this file to settings.yml (git-ignored) and fill in your own values.
#
# This reuses TopologyBuilder's own Settings class/YAML schema wholesale -
# Select the topology separately using Project on the host tile.
# Existing profiles containing topology_file remain compatible.
# Passwords are intentionally NOT supported here - use the ESXI_PASSWORD/
# GNS3_PASSWORD environment variables instead (a .env file works too, see
# .env.example). GNS3_PASSWORD specifically is only needed for Phase B's
# write endpoints (add/remove node/link) - they SSH into the GNS3 VM to
# rebuild its VLAN trunk subinterfaces on every call. Read-only endpoints
# work fine without it.

# A host can be configured before any topology exists. Project selection
# is stored separately by TopologyOperator, outside this host profile.

# Where this process's own log file is written (rotated at 10MB) -
# same setting, same format, as TopologyBuilder's own CLI logging (see
# TopologyBuilder's main.py). The View menu's Logs panel (GET /logs)
# tails this file, so it's what you'd point `topologybuilder logs -n`
# at too if you wanted the CLI's own view of the same entries.
# log_file_path: ./logs/app.log

# Whether importing a .topoproj bundle (POST /project/import) deploys
# incrementally. True (default) reuses anything already live by name and
# only creates what's new/changed, so one slow or failing device (e.g. a
# stuck OVA import) doesn't undo devices from the bundle that already
# deployed successfully - confirmed live: importing a bundle with one
# broken VM still left every other already-existing device untouched and
# working. Set to false for a full deploy instead: resets the ESXi
# vSwitch, deletes ESXi VMs/GNS3 projects not in the imported topology,
# and redeploys everything from scratch even if a same-named node already
# exists - slower and more disruptive to whatever's currently live, but
# guarantees a clean result with nothing left over from a previous
# import. Only affects /project/import - the canvas's own Add Node/Add
# Link always deploy incrementally regardless of this setting, since
# that's inherent to what those two operations are.
#
# IMPORTANT if you set this to false: esxi.ignore_port_groups below
# MUST list your GNS3 VM's own management port group (commonly named
# something like "PG-MGMT"), or a non-incremental deploy will try to
# delete it along with everything else on the vSwitch. Confirmed live:
# ESXi itself refused ("resource is in use") since the GNS3 VM's
# management NIC was actively using it - but that's the hypervisor's
# own safety net, not something this tool guarantees, and a different
# host/timing could plausibly let it through and cut off the GNS3 VM's
# own management access entirely. Don't rely on ESXi catching this for
# you - list the port group explicitly.
incremental_deploy: true

esxi:
  ip: 10.20.20.202
  username: root
  gns3_vm_name: GNS3-VM (1)
  # Must match the ESXi port group actually carrying the GNS3 VM's VLAN
  # trunk NIC on your host - defaults to "PG_GNS3_TRUNK" if omitted, which
  # won't match every host's naming (e.g. "PG-GNS3-TRUNK" with hyphens).
  # Phase B's write endpoints fail with "Could not auto-detect the GNS3
  # VM's trunk interface" if this doesn't match. Same value the
  # TopologyBuilder deploy that created this topology used.
  # trunk_port_group: PG-GNS3-TRUNK
  # Must be the SAME vSwitch the GNS3 VM's trunk port group actually
  # lives on - defaults to "internal_network" if omitted, which is only
  # right if that's genuinely where the trunk NIC is. A mismatch here is
  # silent: ESXi-hosted nodes deploy and power on fine, but their traffic
  # never reaches the GNS3 VM at all (two isolated vSwitches, no uplink
  # between them) - confirmed live the hard way. Same value the
  # TopologyBuilder deploy that created this topology used.
  # virtual_switch: vSwitch0
  # Port groups a non-incremental deploy (incremental_deploy: false
  # above) must never delete, besides the trunk (always protected) and
  # ESXi's own built-in "VM Network"/"Management Network" (also always
  # protected). MUST include your GNS3 VM's own management port group -
  # see the warning on incremental_deploy above for why this matters.
  # Irrelevant (but harmless to set) while incremental_deploy is true,
  # since only a non-incremental deploy ever resets the vSwitch at all.
  # ignore_port_groups: [PG-MGMT]
  # Local filesystem path to the GNS3 VM's own OVA (an NFS share mounted
  # locally works fine here, it's just a path). Enables GNS3-VM deploy:
  # a File menu button to replace the GNS3 VM from this OVA on demand,
  # and automatic recovery at startup if no VM named gns3_vm_name exists
  # on the host at all (never if one exists but just isn't reporting an
  # IP yet, e.g. still booting - only when it's genuinely absent). Unset
  # (the default) leaves both of those unavailable.
  # gns3_vm_ova_path: /mnt/nfs/templates/GNS3-VM.ova
  # ESXi port group for a freshly deployed GNS3 VM's management NIC -
  # required (alongside gns3_vm_ova_path) for the deploy feature above.
  # Must be the OVA's first-added network adapter; trunk_port_group
  # above is reused for the second (trunk) NIC.
  # gns3_vm_mgmt_network: PG-MGMT
  # [start_mac, end_mac] - if set, a freshly deployed GNS3 VM's
  # management NIC gets a MAC address from this inclusive range instead
  # of inheriting the old VM's own MAC, e.g. so a DHCP server can be
  # configured to only hand out IP addresses to MACs in this range. If
  # the old VM's own MAC already falls in the range, it's kept as-is
  # (preserves the same DHCP-leased IP across a redeploy). Unset (the
  # default) leaves the MAC exactly as before this setting existed.
  # gns3_vm_mac_range: ["00:50:56:00:10:00", "00:50:56:00:1f:ff"]
  # ESXi datastore to place a freshly deployed GNS3 VM on - reuses the
  # same datastore setting TopologyBuilder's own node deploys use.
  # Unset auto-picks whichever datastore has the most free space.
  # datastore: datastore1

gns3:
  username: gns3
  # Select the GNS3 project name using Project on the host tile.
  port: 80

api:
  esxi_template_server_url: http://10.20.20.171:8000
  gns3_template_server_url: http://10.20.20.171:8001
  # Powers the landing page's "Generate via LLM" action (POST
  # /design/generate) - an LLM-backed service that turns a natural-
  # language prompt into a topology config, same one TopologyBuilder's
  # own `generate`/`generate-deploy` CLI commands use. Defaults to
  # TopologyBuilder's own hardcoded default (http://10.20.20.172:8002)
  # if omitted - only set this if your lab's generator service lives
  # somewhere else.
  # topology_generator_url: http://10.20.20.172:8002
