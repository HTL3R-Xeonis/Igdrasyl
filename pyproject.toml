[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topologyoperator"
dynamic = ["version"]
description = "GUI tool for operating topologies already deployed by TopologyBuilder."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    # dev, not main - TopologyBuilder's main branch is permanently not
    # merged into (standing project decision, unrelated to code quality).
    "topologybuilder @ git+https://github.com/HTL3R-Xeonis/TopologyBuilder.git@dev",
    "fastapi==0.121.2",
    "uvicorn[standard]==0.38.0",
    "netmiko==4.7.0",
    # Needed for FastAPI's UploadFile (POST /project/import's .topoproj upload) -
    # FastAPI only parses multipart form bodies if this is installed.
    "python-multipart==0.0.20",
    # WebSocket *client* (app/vm_screen.py's own outbound connection to
    # ESXi's WebMKS ticket endpoint) - distinct from FastAPI's own
    # built-in server-side WebSocket support, which only handles the
    # browser-facing side.
    "websockets==17.1",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.dynamic]
version = { attr = "app.version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
ignore = [
    # Broad `except Exception` (often with a bare `pass`) is a real,
    # deliberate, pervasive pattern throughout this codebase for
    # best-effort/non-critical paths (e.g. a stale-project-id refresh
    # that's fine to skip on any failure, cleanup code that shouldn't
    # ever block the main flow) - each one is commented explaining why
    # at its call site. Flagging all ~20 of them isn't catching bugs,
    # just noise against an intentional convention.
    "BLE001", # blind-except
    "S110",   # try-except-pass
    # Nested `with` blocks (e.g. `with patch(...): with pytest.raises(...):`)
    # are a common, defensible test-readability idiom throughout
    # tests/ - ruff can't auto-fix these safely (no fix available even
    # with --unsafe-fixes), and hand-rewriting ~16 call sites for a
    # pure style preference isn't worth the churn.
    "SIM117", # multiple-with-statements
]
