[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topologyoperator"
version = "0.1.0"
description = "GUI tool for operating topologies already deployed by TopologyBuilder."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    # dev, not main - TopologyBuilder's main branch is permanently not
    # merged into (standing project decision, unrelated to code quality).
    "topologybuilder @ git+https://github.com/HTL3R-Xeonis/TopologyBuilder.git@dev",
    "fastapi==0.121.2",
    "uvicorn[standard]==0.38.0",
    "netmiko==4.7.0",
    # Needed for FastAPI's UploadFile (POST /project/import's .topoproj upload) -
    # FastAPI only parses multipart form bodies if this is installed.
    "python-multipart==0.0.20",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
