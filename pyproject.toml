[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topologyoperator"
version = "0.1.0"
description = "GUI tool for operating topologies already deployed by TopologyBuilder."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    # dev, not main - TopologyBuilder's main branch is permanently not
    # merged into (standing project decision, unrelated to code quality).
    "topologybuilder @ git+https://github.com/HTL3R-Xeonis/TopologyBuilder.git@dev",
    "fastapi==0.121.2",
    "uvicorn[standard]==0.38.0",
    "netmiko==4.7.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
